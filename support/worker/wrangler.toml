# Hudini support relay (Cloudflare Worker). No secrets here: see docs/SUPPORT.md for `wrangler secret put ...`.
name = "hudini-support"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://niko-ua-designer.github.io"
BOT_USERNAME = "REPLACE_WITH_BOT_USERNAME"
DAILY_CAP = "500"

[[kv_namespaces]]
binding = "TICKETS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
