[package]
name = "hudini"
version = "1.1.1"
description = "Hudini: stream overlay for OBS and moderator panel, one app with a window and a tray icon"
authors = ["niko-ua-designer"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-opener = "2.7"
serde_json = "1"
sys-locale = "0.3"
hudini-relay = { path = "../relay" }

[target.'cfg(target_os = "linux")'.dependencies]
# той же версии и с теми же возможностями, что у wry: нужен для включения media-stream и WebRTC в WebKitGTK
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
