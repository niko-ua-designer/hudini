[package]
name = "hudini-relay"
version = "1.1.3"
description = "Hudini: local relay from the moderator panel to a streamer's Hudini server over TLS pinned by certificate fingerprint"
authors = ["niko-ua-designer"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
rcgen = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
