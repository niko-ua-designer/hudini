# Builds Hudini Host (Tauri desktop app + Bun server sidecar) and publishes it to Releases
# when a version tag (v1.2.3 or v1.2.3-rc.1) is pushed. The tag must match `const VERSION` in server/server.js.
# Manual run (workflow_dispatch): builds the chosen systems; publishes only from a tag ref with dry_run unchecked, and only with all three systems.
name: Hudini Host release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not publish a release
        type: boolean
        default: true
      systems:
        description: 'Systems to build (comma list of windows, linux, mac); a tag push always builds all three'
        type: string
        default: 'windows,linux,mac'
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      pre: ${{ steps.v.outputs.pre }}
      pretty: ${{ steps.v.outputs.pretty }}
      title: ${{ steps.v.outputs.title }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - name: Version
        id: v
        run: |
          ver=$(grep -oP "^const VERSION = '\K[^']+" server/server.js)
          echo "$ver" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?'
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then echo "tag $GITHUB_REF_NAME does not match VERSION $ver"; exit 1; fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          case "$ver" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
          # Short version for file names and the release title: 1.0.0-rc.4 -> 1.0rc4 / "1.0 RC4", 1.0.0 -> 1.0, 1.0.2 -> 1.0.2
          IFS=. read -r major minor patch <<< "${ver%%-*}"
          base="$major.$minor"; [ "$patch" = 0 ] || base="$base.$patch"
          case "$ver" in
            *-rc.*) rc=${ver##*-rc.}; pretty="${base}rc$rc"; title="$base RC$rc";;
            *) pretty="$base"; title="$base";;
          esac
          echo "pretty=$pretty" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "version $ver -> files $pretty, title \"Hudini $title\""
      - name: Build matrix
        id: m
        env:
          SYSTEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.systems || 'windows,linux,mac' }}
          PUBLISHING: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          all='{"runner":"windows-latest","os":"windows","triple":"x86_64-pc-windows-msvc","bun":"bun-windows-x64","ext":".exe"}
          {"runner":"ubuntu-22.04","os":"linux","triple":"x86_64-unknown-linux-gnu","bun":"bun-linux-x64","ext":""}
          {"runner":"macos-latest","os":"mac","triple":"universal-apple-darwin","bun":"bun-darwin-arm64","ext":""}'
          sel=$(printf '%s\n' "$all" | while read -r line; do
            os=$(printf '%s' "$line" | grep -oP '"os":"\K[a-z]+')
            case ",$SYSTEMS," in *",$os,"*) printf '%s\n' "$line";; esac
          done | paste -sd, -)
          [ -n "$sel" ] || { echo "no valid systems in '$SYSTEMS'"; exit 1; }
          # a release without all three systems would still become "latest" and break updates for the missing one
          if [ "$PUBLISHING" = true ] && [ "$(printf '%s\n' "$sel" | tr ',' '\n' | grep -c '"os"')" -ne 3 ]; then
            echo "publishing needs all three systems (windows,linux,mac), got '$SYSTEMS'; run with dry_run for a partial build"; exit 1
          fi
          echo "matrix=[$sel]" >> "$GITHUB_OUTPUT"

  # Desktop app: Tauri window + tray, the Bun server runs next to it as a sidecar
  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TRIPLE: ${{ matrix.triple }}
      EXT: ${{ matrix.ext }}
      ZIP_NAME: HudiniHost-${{ matrix.os }}-${{ needs.version.outputs.pretty }}.zip   # not ZIP: Info-ZIP reads $ZIP as its default options
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.os == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.triple }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev pkg-config patchelf
      - name: Server sidecar
        run: |
          cd server && npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p ../app/src-tauri/binaries
          B=../app/src-tauri/binaries
          if [ "$TRIPLE" = universal-apple-darwin ]; then
            # Tauri's universal build wants a sidecar per arch plus the lipo-combined one:
            # hudini-server-aarch64-apple-darwin, hudini-server-x86_64-apple-darwin, hudini-server-universal-apple-darwin
            bun build --compile --minify --target=bun-darwin-arm64 server.js --outfile "$B/hudini-server-aarch64-apple-darwin"
            bun build --compile --minify --target=bun-darwin-x64 server.js --outfile "$B/hudini-server-x86_64-apple-darwin"
            lipo -create -output "$B/hudini-server-universal-apple-darwin" "$B/hudini-server-aarch64-apple-darwin" "$B/hudini-server-x86_64-apple-darwin"
            lipo -archs "$B/hudini-server-universal-apple-darwin"
          else
            bun build --compile --minify --target=${{ matrix.bun }} server.js --outfile "$B/hudini-server-$TRIPLE$EXT"
          fi
      - name: App pages
        run: sh tools/build-app.sh
      - name: Tauri build
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npx -y @tauri-apps/cli@2.12.4 build --target "$TRIPLE" --bundles app --config "{\"version\":\"${{ needs.version.outputs.ver }}\"}" -- --locked
          else
            npx -y @tauri-apps/cli@2.12.4 build --target "$TRIPLE" --no-bundle --config "{\"version\":\"${{ needs.version.outputs.ver }}\"}" -- --locked
          fi
      - name: Zip
        run: |
          # Paths from the Tauri project (app/src-tauri, productName "Hudini", binary "hudini"); adjust here if they change
          REL="app/src-tauri/target/$TRIPLE/release"
          APP_EXE="$REL/hudini$EXT"                       # Windows / Linux app binary
          MAC_APP="$REL/bundle/macos/Hudini.app"           # macOS app bundle (sidecar is inside it)
          SIDECAR="app/src-tauri/binaries/hudini-server-$TRIPLE$EXT"
          # Portable: a "HudiniHost" folder (no spaces: the autostart entry is not quoted) with the app, the server next to it, an empty data/ folder and a short readme
          rm -rf pkg && mkdir -p "pkg/HudiniHost/data"
          if [ "$RUNNER_OS" = macOS ]; then
            cp -R "$MAC_APP" "pkg/HudiniHost/"
          else
            cp "$APP_EXE" "pkg/HudiniHost/HudiniHost$EXT"
            cp "$SIDECAR" "pkg/HudiniHost/hudini-server$EXT"
          fi
          cp server/PORTABLE.txt "pkg/HudiniHost/README.txt"
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            (cd pkg && 7z a -tzip -mx=9 "../out/$ZIP_NAME" "HudiniHost")
          else
            (cd pkg && zip -9 -r -y "../out/$ZIP_NAME" "HudiniHost")
          fi
          ls -l out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zip-${{ matrix.os }}
          path: out/*.zip
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the release
    environment: release   # the signing key lives in this environment; it requires the owner's approval
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Ed25519 signature over "hudini-update\n<version>\n" + SHA256SUMS.txt; Hudini Host refuses updates without it.
      # The private key lives only in the HUDINI_SIGNING_KEY secret (made by tools/signing-key.mjs).
      - name: Sign
        env:
          HUDINI_SIGNING_KEY: ${{ secrets.HUDINI_SIGNING_KEY }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          cd dist
          [ -n "$HUDINI_SIGNING_KEY" ] || { echo "secret HUDINI_SIGNING_KEY is not set"; exit 1; }
          node -e '
            const c = require("crypto"), fs = require("fs");
            const msg = Buffer.concat([Buffer.from("hudini-update\n" + process.env.VER + "\n"), fs.readFileSync("SHA256SUMS.txt")]);
            const key = c.createPrivateKey(process.env.HUDINI_SIGNING_KEY);
            const sig = c.sign(null, msg, key);
            if(!c.verify(null, msg, c.createPublicKey(key), sig)) process.exit(1);
            // the secret must match the public key built into Hudini Host, or the release could never update itself
            const pub = c.createPublicKey(key).export({ format: "der", type: "spki" }).toString("base64");
            const want = (/^const UPDATE_KEY = .([^\x27]*)./m.exec(fs.readFileSync("../server/server.js", "utf8")) || [])[1];
            if(pub !== want){ console.error("HUDINI_SIGNING_KEY does not match UPDATE_KEY in server/server.js"); process.exit(1); }
            fs.writeFileSync("SHA256SUMS.txt.sig", sig.toString("base64") + "\n");
          '
      # What's new: the section for this version from CHANGELOG.md (EN/RU/UK/DE lines), without the "## <version>" heading
      - name: Release notes
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: |
          awk -v v="$VER" '/^## /{ on = ($2 == v); next } on' CHANGELOG.md > changelog-section.md
          grep -q '[^[:space:]]' changelog-section.md || { echo "CHANGELOG.md has no section for $VER"; exit 1; }
          P="${{ needs.version.outputs.pretty }}"
          {
            echo "**EN:** Hudini Host, the app for the streamer: overlay server on your PC, file storage and live data. Download the zip for your system: Windows \`HudiniHost-windows-$P.zip\`, Linux \`HudiniHost-linux-$P.zip\` or macOS \`HudiniHost-mac-$P.zip\` (one file for Apple Silicon and Intel). Unzip it into its own folder and run HudiniHost (macOS: Hudini.app). It lives in the tray (next to the clock) and can start with your computer."
            echo "**RU:** Hudini Host, программа для стримера: сервер оверлея на ПК, хранилище файлов и живые данные. Скачай zip для своей системы: Windows \`HudiniHost-windows-$P.zip\`, Linux \`HudiniHost-linux-$P.zip\` или macOS \`HudiniHost-mac-$P.zip\` (один файл для Apple Silicon и Intel). Распакуй в отдельную папку и запусти HudiniHost (macOS: Hudini.app). Программа живёт в трее (у часов) и может запускаться вместе с компьютером."
            echo "**UK:** Hudini Host, програма для стрімера. Завантаж zip для своєї системи (Windows: \`HudiniHost-windows-$P.zip\`, Linux: \`HudiniHost-linux-$P.zip\`, macOS: \`HudiniHost-mac-$P.zip\`), розпакуй в окрему папку й запусти HudiniHost. Програма живе в треї та може запускатися разом із комп'ютером."
            echo "**DE:** Hudini Host, die App für den Streamer. Lade die Zip-Datei für dein System herunter (Windows: \`HudiniHost-windows-$P.zip\`, Linux: \`HudiniHost-linux-$P.zip\`, macOS: \`HudiniHost-mac-$P.zip\`), entpacke sie in einen eigenen Ordner und starte HudiniHost. Die App sitzt im Infobereich (Tray) und kann mit dem Computer starten."
            echo
            echo "## What's new / Что нового / Що нового / Was ist neu"
            echo
            cat changelog-section.md
            echo
            echo "Panel / Пульт: https://niko-ua-designer.github.io/hudini/"
            echo "Guide / Инструкция: https://niko-ua-designer.github.io/hudini/help.html"
          } > release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.ver }}
          name: Hudini ${{ needs.version.outputs.title }}
          prerelease: ${{ needs.version.outputs.pre }}
          make_latest: ${{ needs.version.outputs.pre == 'false' }}
          body_path: release-body.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
