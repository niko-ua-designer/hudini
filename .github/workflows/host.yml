# Собирает программу стримера Overlay Host и выкладывает её в Releases
name: Overlay Host build
on:
  push:
    branches: [main]
    paths: ['host/**', 'widget.html', 'core.js', 'core.css', '.github/workflows/host.yml']
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # только для публикации релиза
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Build
        run: sh host/build.sh
      - name: Zip
        run: |
          cd host/dist
          for f in *; do zip -9 "$f.zip" "$f"; done
          sha256sum *.zip > SHA256SUMS.txt
      - name: Version
        id: v
        run: echo "ver=$(grep -oP "VERSION = '\K[^']+" host/server.js)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: host-v${{ steps.v.outputs.ver }}
          name: Overlay Host ${{ steps.v.outputs.ver }}
          make_latest: true
          body: |
            **EN:** App for the streamer: a local overlay server + live CS2 data. Windows: download `OverlayHost-windows.exe.zip`, unzip it into its own folder and run it.
            **RU:** Программа для стримера: свой сервер оверлея на ПК и данные из CS2. Windows: скачай `OverlayHost-windows.exe.zip`, распакуй в отдельную папку и запусти.

            Guide / Инструкция: https://github.com/${{ github.repository }}/blob/main/host/README.md
          files: |
            host/dist/*.zip
            host/dist/SHA256SUMS.txt
