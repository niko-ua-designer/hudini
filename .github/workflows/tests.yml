# End-to-end tests: panel, widget and Hudini Host in real Chromium
name: Tests
on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Install
        run: |
          (cd host && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests && npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Test
        run: cd tests && npm test
