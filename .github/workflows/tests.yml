# End-to-end tests: panel, widget and Hudini Host in real Chromium
name: Tests
on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Install
        run: |
          (cd host && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests && npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Test
        run: cd tests && npm test
