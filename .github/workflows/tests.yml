# End-to-end tests: panel, widget and Hudini Host in real Chromium
name: Tests
on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24 }
      - name: Install
        run: |
          (cd host && npm ci --ignore-scripts --no-audit --no-fund)
          (cd tests && npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Test
        run: cd tests && npm test
