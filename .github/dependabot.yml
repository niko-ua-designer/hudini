# Weekly update checks; security fixes arrive at once through Dependabot security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip versions younger than a week (hijacked releases are usually pulled fast)
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip versions younger than a week (hijacked releases are usually pulled fast)
    groups:
      server: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /tests
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip versions younger than a week (hijacked releases are usually pulled fast)
    groups:
      tests: { patterns: ['*'] }
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # skip versions younger than a week (hijacked releases are usually pulled fast)
    groups:
      tauri: { patterns: ['*'] }
