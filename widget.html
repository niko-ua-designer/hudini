<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Hudini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@700&family=Montserrat:wght@900&family=Press+Start+2P&family=Russo+One&family=Noto+Color+Emoji&display=swap">
<link rel="stylesheet" href="core.css?v=10">
<script src="https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js" integrity="sha384-ilRYg/zm2XqUafLvBoGVk40UfNRnvUkYMy+e/JPo4YgsFR6X9Q3jYEkqFQXquX4r" crossorigin="anonymous"></script>
<script src="core.js?v=13"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;overflow:hidden;transition:opacity .35s}
#stage.all-hidden{opacity:0}
#stage.shake{animation:stage-shake .6s linear}
@keyframes stage-shake{10%,50%,90%{transform:translate(-1.2%,.8%)}30%,70%{transform:translate(1.2%,-.8%)}20%,60%{transform:translate(.6%,1%)}40%,80%{transform:translate(-.6%,-1%)}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:100000}

/* Плавность: смягчает задержку сети между обновлениями */
.el{transition:left .1s linear,top .1s linear,width .1s linear,transform .1s linear,opacity .35s ease}
.el .txt,.el .tw{transition:font-size .1s linear}
.el img.content,.el video.content{transition:height .1s linear}
.el.instant,.el.instant .txt,.el.instant .tw,.el.instant .content{transition:none!important}

/* Проверочная рамка: должна совпасть с краями экрана стрима */
#calib{position:absolute;inset:0;z-index:100001;pointer-events:none;display:none;border:.6vmin solid #ff2e88;box-sizing:border-box;font:700 2.2vmin system-ui,'Noto Color Emoji',sans-serif;color:#fff}
#calib.show{display:block}
#calib i{position:absolute;width:6vmin;height:6vmin;border:.6vmin solid #00e5ff}
#calib i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#calib i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#calib i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#calib i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#calib div{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;padding:1.5vmin 3vmin;border-radius:1vmin;text-align:center;line-height:1.5}

#debug{position:fixed;left:10px;top:10px;font:600 14px system-ui,'Noto Color Emoji',sans-serif;color:#fff;background:#000b;padding:6px 10px;border-radius:6px;z-index:100002;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="confetti"></canvas>
  <div id="calib"><i></i><i></i><i></i><i></i><div id="calibText"></div></div>
</div>
<div id="debug"></div>

<script>
// ================== НАСТРОЙКИ ==================
// Должны совпадать с moderator.html
const BROKER_URL   = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC_PREFIX = 'stream-overlay/v1';
// Режим «Локальный файл» в OBS: вставь сюда ЦЕЛИКОМ ссылку для OBS из пульта
const LINK = '';
// ===============================================

const WIDGET_VER=12;
let lastError='';
addEventListener('error', e=>{ lastError=String(e.message||e.error||'ошибка').slice(0,200); });
addEventListener('unhandledrejection', e=>{ lastError=String(e.reason?.message||e.reason||'ошибка').slice(0,200); });
const stage=document.getElementById('stage');
const qs=new URLSearchParams(location.search);
// Ключи стоят после # : эта часть ссылки не уходит ни на сайт, ни на сервер
let linkHash=location.hash.slice(1), room=qs.get('room');
if(LINK){ try{ const u=new URL(LINK); room=room||u.searchParams.get('room'); linkHash=linkHash||u.hash.slice(1); }catch{} }
const hp=new URLSearchParams(linkHash);
const brokerUrl=qs.get('broker') || BROKER_URL;
const DEBUG=qs.has('debug');
const dbg=document.getElementById('debug');
function status(t, force){ console.log('[overlay]', t); if(DEBUG||force){ dbg.style.display='block'; dbg.textContent=t; } }

// 16:9 сцена, вписанная в окно источника
function fit(){
  const W=innerWidth, H=innerHeight;
  let w=W, h=w*9/16; if(h>H){ h=H; w=h*16/9; }
  stage.style.width=w+'px'; stage.style.height=h+'px';
  stage.style.setProperty('--u', (h/100)+'px');
  const cv=document.getElementById('confetti'); cv.width=w; cv.height=h;
}
addEventListener('resize', fit); fit();

// ================== ОТРИСОВКА ==================
const nodes=new Map();
let visible=true, lastState={ visible:true, els:[] };
function pop(node){ const b=node.querySelector('.body'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
function applyState(s){
  lastState=s; visible=s.visible;
  stage.classList.toggle('all-hidden', !s.visible);
  const seen=new Set(), now=nowMs();
  s.els.forEach((el,i)=>{
    seen.add(el.id);
    let node=nodes.get(el.id);
    if(node && node.dataset.type!==el.type){ node.remove(); nodes.delete(el.id); node=null; }
    const isNew=!node;
    if(isNew){ node=buildNode(el); node.classList.add('instant'); node._shown=false; node._noPh=true; stage.appendChild(node); nodes.set(el.id,node); }
    node._el=el;
    paintNode(node, el, i+1);
    tickNode(node, el, now);
    const show=!el.hidden;
    node._vis = show ? 1 : 0; node._z=i+1;
    node.style.opacity = show ? el.op : 0;
    if(el.type==='video'){
      const v=node.querySelector('video');
      v.muted=!el.sound; v.volume=el.vol;
      const restart = el.restart && el.restart!==node._restart;
      node._restart=el.restart;
      if(show){
        if((!node._shown && !isNew) || restart) v.currentTime=0;
        if(v.paused) v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
      } else if(!v.paused) v.pause();
    }
    if(el.type==='web'){
      // скрытый сайт/ролик выгружаем, чтобы не играл звук; при показе он начнётся заново
      const src = show ? embedSrc(el, location.hostname, false) : null;
      setFrameSrc(node, src ? src+(src.includes('?')?'&':'?')+'_r='+el.restart : null, parseEmbed(el.url).kind==='site');
      if(src) playerApply(node, el, false);
    }
    if(show && !node._shown) pop(node);
    node._shown=show;
    if(isNew){ void node.offsetWidth; requestAnimationFrame(()=>node.classList.remove('instant')); }
  });
  for(const [id,node] of nodes) if(!seen.has(id)){
    nodes.delete(id); node.style.opacity=0;
    node.querySelector('video')?.pause();
    setTimeout(()=>node.remove(), 400);
  }
}
// Анимации движения: 60 кадров в секунду, считаются по общему времени с пультом
function animLoop(){
  const now=nowMs();
  for(const node of nodes.values()){
    const el=node._el; if(!el) continue;
    if(animApply(node, el, now)==='reset'){ paintNode(node, el, node._z); node.style.opacity = node._vis ? el.op : 0; }
  }
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);
// Таймеры и счётчики тикают сами, без сети
setInterval(()=>{
  const now=nowMs();
  for(const node of nodes.values()){
    const el=node._el; if(!el) continue;
    const s=tickNode(node, el, now);
    if(el.type==='timer' && s){
      if(node._ended===false && s.ended && !el.hidden && visible){
        if(el.endSound) playSound(el.endSound, 0.8);
        if(el.endConfetti) confetti();
      }
      node._ended=s.ended;
    }
  }
}, 100);

// ================== ЭФФЕКТЫ ==================
const sounds=new Set();
const pendingSounds=new Map();
function playSound(src, vol){
  const id=assetId(src);
  if(id){ const u=Assets.resolve(src); if(!u){ pendingSounds.set(id, vol); return; } src=u; }
  const a=new Audio(src); a.volume=num(vol,0.7,0,1);
  sounds.add(a); a.addEventListener('ended', ()=>sounds.delete(a));
  a.play().catch(e=>status('Звук не проигрался: '+e.message));
}
function stopSounds(){ for(const a of sounds) a.pause(); sounds.clear(); }

let parts=[], confettiRunning=false, lastT=0;
function confetti(){
  const cv=document.getElementById('confetti'), W=cv.width, H=cv.height;
  const colors=['#ff4d5e','#ffd23f','#3ddc97','#4cc9f0','#7c5cff','#ff8fab','#ffffff'];
  for(const side of [0,1]) for(let i=0;i<110;i++){
    const dir=side?-1:1;
    parts.push({ x:side?W:0, y:H*0.95, vx:dir*(W*0.006+Math.random()*W*0.012), vy:-(H*0.018+Math.random()*H*0.022),
      s:H*(0.008+Math.random()*0.008), r:Math.random()*6, vr:(Math.random()-0.5)*0.35,
      c:colors[Math.random()*colors.length|0], g:H*0.00055, life:0 });
  }
  if(!confettiRunning){ confettiRunning=true; lastT=performance.now(); requestAnimationFrame(tick); }
}
function tick(t){
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
  const dt=Math.min(3,(t-lastT)/16.67); lastT=t;
  ctx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+50 && p.life<400);
  for(const p of parts){
    p.vy+=p.g*dt; p.vx*=Math.pow(0.985,dt); p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; p.life+=dt;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2*Math.abs(Math.cos(p.r*2))+1); ctx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else { confettiRunning=false; ctx.clearRect(0,0,cv.width,cv.height); }
}
function shake(){ stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); }
let calibT=null;
function calib(){
  const c=document.getElementById('calib');
  document.getElementById('calibText').innerHTML=
    `Окно источника: <b>${innerWidth}×${innerHeight}</b><br>`+
    `Розовая рамка должна идти ровно по краям экрана стрима.<br>`+
    `Если она меньше экрана: в OBS выдели источник → <b>Ctrl+F</b> (Растянуть на экран)`;
  c.classList.add('show'); clearTimeout(calibT); calibT=setTimeout(()=>c.classList.remove('show'), 10000);
}

function onFx(f){
  if(!f || typeof f!=='object') return;
  if(f.type==='sound'){ const src=safeSrc(f.src); if(src) playSound(src, f.vol); }
  else if(f.type==='stopsounds') stopSounds();
  else if(f.type==='confetti') confetti();
  else if(f.type==='shake') shake();
  else if(f.type==='calib') calib();
  else if(f.type==='seek'){ const node=nodes.get(str(f.id,40)); if(node?._el) playerSeek(node, node._el, num(f.d,0,-3600,3600)); }
  else if(f.type==='cs2test'){ const ev={ n:Math.round(num(f.n,3,2,5)), name:str(f.name,40), weapon:str(f.weapon,40), hs:Math.round(num(f.hs,0,0,5)) };
    for(const n of nodes.values()) if(n._el?.type==='cs2' && n._el.view==='streak'){ const c=n.querySelector('.cs2'); if(c) cs2Popup(c, ev); } }
}

// ================== СИНХРОНИЗАЦИЯ ЧАСОВ ==================
// Пульт присылает своё время; берём самое «быстрое» из последних измерений (меньше всего задержки сети)
const offs=[];
function clockSample(t){
  if(!Number.isFinite(t)) return;
  offs.push(t-Date.now()); if(offs.length>12) offs.shift();
  CLOCK_OFFSET=Math.max(...offs);
}

// ================== СВЯЗЬ ==================
// Принимаем только сообщения, подписанные ключом модератора. Остальное (подделки, мусор) молча выкидываем.
let KEYS=null, lastStateT=0;
const seenFx=new Map();
async function start(){
  if(!room){ status('Нет кода комнаты: скопируй ссылку для OBS в пульте модератора', true); return; }
  if(!hp.get('k') || !hp.get('p')){ status('Старая или обрезанная ссылка: попроси у модератора новую ссылку для OBS', true); return; }
  if(typeof mqtt==='undefined'){ status('Не загрузилась библиотека mqtt.js: проверь интернет', true); return; }
  try{ KEYS=await importRoomKeys({ k:hp.get('k'), p:hp.get('p') }); }
  catch{ status('Ключ в ссылке повреждён: попроси у модератора новую ссылку', true); return; }
  const base=`${TOPIC_PREFIX}/${room}`;
  const T={ state:base+'/state', fx:base+'/fx', hb:base+'/hb', cs2:base+'/cs2' };
  const client=mqtt.connect(brokerUrl, { clientId:'wid_'+Math.random().toString(36).slice(2,12),
    clean:true, keepalive:30, reconnectPeriod:2000, connectTimeout:8000 });
  Assets.setRoom(client, base);
  Assets.onReady=id=>{
    applyState(lastState);   // файл догрузился: дорисовать картинку/видео
    if(pendingSounds.has(id)){ const v=pendingSounds.get(id); pendingSounds.delete(id); playSound('asset:'+id, v); }
  };
  // Сообщаем пульту, что виджет жив (зашифровано ключом комнаты)
  const wid=Math.random().toString(36).slice(2,8);
  setInterval(async()=>{ if(!client.connected) return;
    client.publish(T.hb, await sealJSON(KEYS, { id:wid, ver:WIDGET_VER, w:innerWidth, h:innerHeight, n:nodes.size, vis:visible, err:lastError, t:Date.now() }, false), { qos:0 });
  }, 3000);
  client.on('connect', ()=>{ status('онлайн, комната '+room); client.subscribe([T.state, T.fx, T.cs2], { qos:1 }); Assets.resubscribe(); applyState(lastState); });
  client.on('reconnect', ()=>status('переподключение…'));
  client.on('offline', ()=>status('нет связи'));
  client.on('error', e=>status('ошибка: '+e.message));
  let queue=Promise.resolve();   // по очереди, чтобы порядок сообщений не перепутался
  client.on('message', (topic, payload, packet)=>{ queue=queue.then(()=>onMessage(topic, payload, packet)).catch(e=>console.warn(e)); });
  async function onMessage(topic, payload, packet){
    if(!payload.length) return;                      // пустые «удаления» не принимаем: так нельзя стереть экран
    if(topic===T.cs2){                               // данные CS2 шлёт программа стримера: зашифрованы ключом комнаты
      const d=await unsealJSON(KEYS, payload, false);
      if(d){ CS2=d; CS2.at=packet.retain ? Number(d.t)||0 : Date.now(); CS2._skew=0; for(const n of nodes.values()) if(n._el?.type==='cs2' && !n._animOn) paintNode(n, n._el, n._z); }
      return;
    }
    const plain=await unseal(KEYS, payload, true);
    if(!plain){ console.warn('[overlay] отброшено неподписанное сообщение', topic); return; }
    if(Assets.handle(topic, plain)) return;
    let msg; try{ msg=JSON.parse(TD.decode(plain)); }catch{ return; }
    if(!msg || typeof msg!=='object') return;
    if(!packet.retain) clockSample(Number(msg.t));
    // Пульт новее виджета: перезагрузиться в обход кэша OBS (один раз на версию)
    if(Number(msg.wv)>WIDGET_VER && Number(qs.get('upd')||0)<Number(msg.wv)){
      const u=new URL(location.href); u.searchParams.set('upd', String(Number(msg.wv))); u.searchParams.set('v', String(Date.now()));
      location.replace(u.href); return;
    }
    if(topic===T.state){
      const t=Number(msg.t)||0;
      if(t<lastStateT) return;                       // повтор старого сообщения
      lastStateT=t; applyState(sanitizeState(msg));
    } else if(topic===T.fx){
      // эффекты: только свежие и каждый один раз (против повторной отправки перехваченных)
      const t=Number(msg.t)||0, key=t+':'+msg.n;
      if(Math.abs(nowMs()-t)>20000 || seenFx.has(key)) return;
      seenFx.set(key, Date.now()); for(const [k,v] of seenFx) if(Date.now()-v>60000) seenFx.delete(k);
      onFx(msg);
    }
  }
}
start();
</script>
</body>
</html>
