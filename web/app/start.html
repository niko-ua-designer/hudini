<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Hudini</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="start.css">
<script src="../shared/i18n.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/sounds.js"></script>
<script src="applog.js"></script>
<script src="store.js"></script>
<script src="sessions.js"></script>
<script src="updates.js"></script>
</head>
<body>
<aside class="rail">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10l-1 11H8z"/><path d="M8 11h8"/><path d="M2 17.5c0-1.4 4.5-2.5 10-2.5s10 1.1 10 2.5S17.5 20 12 20 2 18.9 2 17.5z"/></svg></div>
    <b>Hudini</b>
  </div>
  <button class="tab" id="tabStr" data-tab="str" type="button"><span class="ti">🎬</span><span><b>Стример</b><small>этот ПК</small></span></button>
  <button class="tab" id="tabMod" data-tab="mod" type="button"><span class="ti">🛡</span><span><b>Модератор</b><small>пульт и стримеры</small></span></button>
  <div class="grow"></div>
  <label class="chk"><input type="checkbox" id="remember"> Запоминать роль</label>
  <button class="linkbtn" id="updOpen" type="button" hidden>🔄 Обновления</button>
  <button class="linkbtn" id="logsBtn" type="button" hidden>📁 Журналы</button>
  <div class="foot"><span data-i18n-switch></span><small id="ver" data-i18n-skip></small></div>
</aside>

<main>
  <div class="banner crash" id="crashBanner" hidden>
    <span>Прошлый запуск завершился ошибкой</span>
    <span class="btns"><button id="crashCopy" type="button">Скопировать</button><button id="crashHide" type="button">Скрыть</button></span>
  </div>
  <div class="banner" id="updBanner" hidden>
    <span><span>Доступна новая версия</span> <b id="updVer" data-i18n-skip></b></span>
    <button class="pri" id="updBtn" type="button">Обновить</button>
  </div>

  <section id="paneStr" hidden>
    <div class="hero">
      <div class="big">🎬</div>
      <h1>Оверлей на этом ПК</h1>
      <p class="muted">Сервер, ссылка для OBS и код для модераторов: всё в одном окне.</p>
      <button class="pri lg" id="startBtn" type="button">Запустить</button>
      <p class="err" id="startErr" hidden data-i18n-skip></p>
    </div>
  </section>

  <section id="paneMod" hidden>
    <div class="toolbar">
      <input id="codeIn" placeholder="Вставь код hudini1:… и нажми Enter" autocomplete="off" spellcheck="false">
      <button id="codeAdd" type="button">➕ Добавить</button>
    </div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden>
      <div class="big">🛡</div>
      <h2>Пока нет ни одного стримера</h2>
      <p class="muted">Попроси стримера прислать код для модератора. Вставь его выше, нажми Ctrl+V или перетащи сюда.</p>
    </div>
  </section>
</main>

<div class="drop" id="drop" hidden><div>Отпусти код здесь</div></div>
<div class="menu" id="menu" hidden>
  <button type="button" data-act="rename">✎ Переименовать</button>
  <button type="button" data-act="pin">📌 Закрепить</button>
  <button type="button" data-act="unpin">📌 Открепить</button>
  <button type="button" data-act="del" class="bad">🗑 Удалить</button>
</div>
<div id="toast"></div>
<script src="start.js"></script>
</body>
</html>
