<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hudini · one app for streamer and moderator</title>
<meta name="description" content="Free, open source stream overlay for OBS that a moderator controls from the Hudini app. Text, pictures, GIFs, timers, polls, cases, Twitch chat, CS2. Direct encrypted connection, no Hudini cloud services, the moderator connects directly to the streamer's PC.">
<meta name="google-site-verification" content="LoxZv0Ma7iTypIJH2iirwQxE52_-AyxZGqO3PhJuCA4">
<meta name="theme-color" content="#08090f">
<link rel="icon" href="shared/icons/icon-192.png">
<link rel="preload" href="shared/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="shared/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site.css?v=9">
<script src="lang-route.js?v=1"></script>
<script src="shared/connect-guides.js?v=1"></script>
<script src="site-texts.js?v=2"></script>
<script src="site.js?v=5" defer></script>

<body data-page="home">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="top">
  <a class="logo" href="index.html"><img src="shared/icons/icon-192.png" alt="">Hudini</a>
  <nav><a href="#start" data-t="start"></a><a href="#connect" data-t="connect"></a><a href="#features" data-t="features"></a><a href="#cs2">CS2</a><a href="#privacy" data-t="privacy"></a><a href="help.html" data-help data-t="help"></a><a href="report.html" data-rep data-t="report"></a></nav>
  <a class="btn small primary" data-dl data-os-label target="_blank" rel="noopener"></a>
  <select class="lang" aria-label="Language"></select>
</header>

<main>
  <section class="hero wrap">
    <span class="pill"><b></b><span data-t="badge"></span></span>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="cta">
      <a class="btn primary shine" data-dl data-os-label target="_blank" rel="noopener"></a>
      <a class="btn ghost" href="#connect" data-t="howConnect"></a>
    </div>
    <small class="free"><span data-t="dlOther"></span> <span id="otherOs"></span> · <a data-sums target="_blank" rel="noopener" data-t="dlSums"></a></small>
    <div class="demo-wrap"><div class="demo" id="demo" role="img" data-t-aria="demoAria"></div></div>
    <div class="fn-strip" id="fnStrip"></div>
  </section>

  <section class="block wrap reveal" id="how">
    <h2 data-t="hTitle"></h2><p class="lead" data-t="hLead"></p>
    <div class="flow" id="flow"></div>
  </section>

  <section class="block wrap reveal" id="start">
    <h2 data-t="startTitle"></h2><p class="lead" data-t="startLead"></p>
    <div class="roles">
      <div class="role s"><h3 data-t="sTitle"></h3><ol id="sSteps"></ol></div>
      <div class="role m"><h3 data-t="mTitle"></h3><ol id="mSteps"></ol></div>
    </div>
  </section>

  <section class="block wrap reveal" id="connect">
    <h2 id="cTitle"></h2><p class="lead" id="cLead"></p>
    <div class="chooser" id="chooser"></div>
  </section>

  <section class="block wrap reveal" id="features">
    <h2 data-t="fTitle"></h2><p class="lead" data-t="fLead"></p>
    <div class="cards glow c3" data-cards="f1,f2,f3,f4,f5,f6"></div>
  </section>

  <section class="block wrap reveal" id="cs2">
    <div class="cs2-grid">
      <div class="cs2-text">
        <span class="tag" data-t="csTag"></span>
        <h2 data-t="csTitle"></h2>
        <p class="lead" data-t="csLead"></p>
        <ul class="ticks" id="csList"></ul>
      </div>
      <div class="cs2-mini" id="csMini" role="img" data-t-aria="csAria"></div>
    </div>
  </section>

  <section class="block wrap reveal" id="privacy">
    <h2 data-t="pTitle"></h2><p class="lead" data-t="pLead"></p>
    <div class="cards glow" data-cards="p1,p2,p3,p4"></div>
  </section>

  <section class="block wrap reveal legend">
    <h2 data-t="lTitle"></h2><p data-t="lText"></p>
  </section>

  <section class="wrap reveal">
    <div class="band">
      <h2 data-t="ctaTitle"></h2>
      <p data-t="ctaText"></p>
      <div class="cta">
        <a class="btn primary shine" data-dl data-os-label target="_blank" rel="noopener"></a>
        <a class="btn ghost" href="#connect" data-t="howConnect"></a>
      </div>
    </div>
  </section>
</main>

</div></footer>
