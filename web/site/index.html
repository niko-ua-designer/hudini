<title>Hudini · one app for streamer and moderator</title>
<meta name="description" content="Free, open source stream overlay for OBS that a moderator controls from the Hudini app. Text, pictures, GIFs, timers, polls, cases, Twitch chat, CS2. Direct encrypted connection, no Hudini cloud services, the moderator connects directly to the streamer's PC.">

<body data-page="home">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="top">
  <a class="logo" href="index.html"><img src="shared/icons/icon-192.png" alt="">Hudini</a>
  <nav><a href="#features" data-t="features"></a><a href="#connect" data-t="connect"></a><a href="#cs2">CS2</a><a href="help.html" data-help data-t="help"></a><a href="report.html" data-rep data-t="report"></a></nav>
  <a class="btn small primary" data-dl data-os-label target="_blank" rel="noopener"></a>
  <select class="lang" aria-label="Language"></select>
</header>

<main>
  <section class="hero wrap sh-hero">
    <div class="sh-hero-text">
      <span class="pill"><b></b><span data-t="badge"></span></span>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <div class="cta">
        <a class="btn primary shine" data-dl data-os-label target="_blank" rel="noopener"></a>
        <a class="btn ghost" href="#new" data-t="newLink"></a>
      </div>
      <small class="free"><span data-t="dlOther"></span> <span id="otherOs"></span> <span class="sep" aria-hidden="true">·</span> <a data-sums target="_blank" rel="noopener" data-t="dlSums"></a></small>
    </div>
    <div class="sh-shot sh-video">
      <video class="sh-vid" autoplay muted loop playsinline preload="metadata" poster="img/hero-poster.webp" width="1600" height="900" aria-label="" data-t-label="altPanel">
        <source src="img/hero.webm" type="video/webm">
        <source src="img/hero.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="block wrap reveal" id="new">
    <h2 data-t="newTitle"></h2><p class="lead" data-t="newLead"></p>
    <div class="bento">
      <article class="tile t-media"><div class="tx"><h3 data-t="n1t"></h3><p data-t="n1d"></p></div><img src="img/media.webp" width="1200" height="750" loading="lazy" alt="" data-t-alt="altMedia"></article>
      <article class="tile t-cur"><div class="tx"><h3 data-t="n2t"></h3><p data-t="n2d"></p></div><img src="img/cursors.webp" width="1200" height="750" loading="lazy" alt="" data-t-alt="altCursors"></article>
      <article class="tile"><div class="tx"><h3 data-t="n3t"></h3><p data-t="n3d"></p></div></article>
      <article class="tile"><div class="tx"><h3 data-t="n4t"></h3><p data-t="n4d"></p></div></article>
      <article class="tile"><div class="tx"><h3 data-t="n5t"></h3><p data-t="n5d"></p></div></article>
      <article class="tile"><div class="tx"><h3 data-t="n6t"></h3><p data-t="n6d"></p></div></article>
    </div>
  </section>

  <section class="block wrap reveal" id="start">
    <h2 data-t="hTitle"></h2><p class="lead" data-t="hLead"></p>
    <div class="roles">
      <div class="role s"><h3 data-t="sTitle"></h3><ol id="sSteps"></ol></div>
      <div class="role m"><h3 data-t="mTitle"></h3><ol id="mSteps"></ol></div>
    </div>
  </section>

  <section class="block wrap reveal" id="features">
    <h2 data-t="fTitle"></h2><p class="lead" data-t="fLead"></p>
    <div class="cards glow c3" data-cards="f1,f2,f3,f4,f5,f6"></div>
  </section>

  <section class="block wrap reveal" id="cs2">
    <div class="cs2-grid sh-cs">
      <div class="cs2-text">
        <span class="tag" data-t="csTag"></span>
        <h2 data-t="csTitle"></h2>
        <p class="lead" data-t="csLead"></p>
        <ul class="ticks" id="csList"></ul>
      </div>
      <img class="sh-radar" src="img/radar.webp" width="1200" height="750" loading="lazy" alt="" data-t-alt="altRadar">
    </div>
  </section>

  <section class="block wrap reveal" id="privacy">
    <h2 data-t="pTitle"></h2><p class="lead" data-t="pLead"></p>
    <div class="cards glow" data-cards="p1,p2,p3,p4"></div>
  </section>

  <section class="block wrap reveal legend">
    <h2 data-t="lTitle"></h2><p data-t="lText"></p>
  </section>

  <section class="wrap reveal">
    <div class="band">
      <h2 data-t="ctaTitle"></h2>
      <p data-t="ctaText"></p>
      <div class="cta">
        <a class="btn primary shine" data-dl data-os-label target="_blank" rel="noopener"></a>
        <a class="btn ghost" href="#connect" data-t="howConnect"></a>
      </div>
    </div>
  </section>
</main>
